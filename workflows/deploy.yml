# TÙY CHỌN: tự deploy bằng GitHub Actions.
# Nếu đã dùng cách "Import a repository" của Cloudflare (khuyến nghị) thì KHÔNG cần file này.
# Muốn tự chạy mỗi lần push: bỏ dấu # ở 2 dòng "push" bên dưới.
name: Deploy to Cloudflare
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
