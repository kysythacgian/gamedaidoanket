<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết</title><link rel="stylesheet" href="style.css">
<style>
  #join{text-align:center;padding:24px 16px}
  #join .logo{width:120px;height:120px;object-fit:contain;display:block;margin:4px auto 6px;
              filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  #join h1{margin:6px 0 8px;color:#fff;font-size:clamp(19px,3.4vw,25px);line-height:1.2}
  #join .slogan{color:#FFFF00;font-size:clamp(18px,4vw,28px);line-height:1.4;margin:10px 0 20px;font-weight:700}
  #join .slogan b{color:#FFFF00;display:block;font-size:inherit;margin-top:4px;letter-spacing:0;font-weight:700}
  /* Nút QUAY: đặt trực tiếp trong index để chắc chắn ghi đè CSS cũ */
  #board button#spin,
  #spin {
    background: transparent !important;
    background-color: transparent !important;
    color: #ff1e1e !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none;
    font-weight: 1000 !important;
    text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff, 0 -1px 0 #fff, 0 3px 5px #000 !important;
    -webkit-text-stroke: .5px #fff;
    padding: 0 !important;
    line-height: 1 !important;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #spin:disabled { opacity: 1 !important; }
  #spin:not(:disabled) { animation: spinTextPulse 1.2s infinite; }
  @keyframes spinTextPulse {
    50% { text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff, 0 -1px 0 #fff, 0 3px 5px #000, 0 0 12px #ff2020; }
  }
  /* Sân khấu: đếm ngược và hiệu ứng lúc xe chạy */
  #countdown{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#fff3 0%,#07152de8 65%);font-size:clamp(90px,24vw,220px);font-weight:1000;color:#ffd447;text-shadow:0 0 18px #ffcf32,0 8px 0 #7b2100;}
  #countdown.show{display:grid;animation:countFlash .65s ease both}
  @keyframes countFlash{0%{opacity:0;transform:scale(.45)}45%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
  #board.bd-run{animation:stageShake .22s linear infinite}
  @keyframes stageShake{0%,100%{filter:drop-shadow(0 0 0 #ffdf55)}50%{filter:drop-shadow(0 0 14px #ffdf55)}}
  #ov #card{box-shadow:0 0 0 3px #ffd447,0 0 35px #ffcf32aa}
  #card .hd{letter-spacing:.04em}

  /* Cửa sổ kết quả quay: ảnh vuông 1:1 (1080x1080), không nền ngoài, không tiêu đề */
  #ov.ban{background:transparent;pointer-events:none}
  #card.ban{width:min(92vmin,1080px);height:min(92vmin,1080px);max-height:none;aspect-ratio:1/1;padding:0;overflow:hidden;position:relative;border-radius:22px;background:#000 center/cover no-repeat;box-shadow:0 0 0 3px #ffd447,0 12px 40px #000a;pointer-events:auto}
  #card.ban .cap{position:absolute;left:0;right:0;bottom:0;padding:18% 5% 5%;background:linear-gradient(to top,#000d 0%,#000a 45%,#0000 100%);color:#fff;text-align:center}
  #card.ban .cap small{display:block;font-size:clamp(16px,3.6vmin,36px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.92;text-shadow:0 2px 8px #000}
  #card.ban .cap b{display:block;margin-top:.15em;font-size:clamp(30px,8.5vmin,86px);line-height:1.05;font-weight:900;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 var(--c),0 0 22px var(--c),0 4px 14px #000}
  .endboard{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#8a1111,#180606 75%);padding:16px;text-align:center}
  .endboard .panel{width:min(94vw,720px);max-height:90vh;overflow:auto;border:2px solid #ffd447;border-radius:22px;padding:22px;background:#ffffff12;box-shadow:0 0 30px #ffd44755}
  .endboard h2{font-size:clamp(28px,6vw,54px);color:#ffd447;margin:0 0 8px}
  .endboard .rank{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;margin:7px 0;border-radius:12px;background:#ffffff18;font-size:clamp(17px,3vw,25px);font-weight:800;text-align:left}
  .endboard .rank:first-child{background:#ffd447;color:#4b1700}
</style>
</head><body>
<div id="join" class="screen">
  <img class="logo" src="icon.png" alt="Logo" onerror="this.style.display='none'">
  <h1>Game "Đại Đoàn Kết"</h1>
  <p class="slogan">NHIỆT LIỆT CHÀO MỪNG<b>NGÀY HỘI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC!</b></p>
  <p id="rname" style="color:#7CFC9B;font-weight:800;font-size:20px;margin:0 0 10px"></p>
  <p id="jmsg" style="color:#FFFF00;margin:0 0 10px;display:none"></p>
  <input id="rc" maxlength="8" placeholder="Nhập mã phòng" autocapitalize="characters" autocomplete="off" style="display:none;text-transform:uppercase;text-align:center;letter-spacing:4px">
  <input id="nm" maxlength="14" placeholder="Nhập tên của bạn">
  <button class="big" id="go">THAM GIA</button>
</div>
<div id="countdown" aria-live="assertive"></div>
<div id="app" class="hide"><div id="wrap"><div id="board"><img id="car" src="car.svg" alt=""><button id="spin" disabled>QUAY!</button></div></div>
<div id="side"><div id="msg"></div><div id="score"></div></div></div>
<div id="ov" class="hide"><div id="card"></div></div>
<script src="questions.js"></script><script src="board.js"></script><script src="common.js"></script>
<script>
const Q=window.QUESTIONS;SRC=()=>S.mode=="all"?(S.pl&&S.pl[me]||null):S.turn;let me=ROOM?localStorage["pid_"+ROOM]:null,quizOn=false,doneId=0,chain=Promise.resolve(),decks={},endShown=false;
function enter(){$("#join").classList.add("hide");$("#app").classList.remove("hide");fit();S={players:[],turn:null,dur:6000};loop();poll(onS)}
function showJoin(msg,keepName){const j=$("#jmsg");if(msg){j.textContent=msg;j.style.display="block"}
 try{localStorage.removeItem("pid_"+ROOM);if(!keepName)localStorage.removeItem("pname")}catch(e){}
 me=null;$("#nm").value=keepName&&localStorage.pname||"";$("#join").classList.remove("hide");$("#app").classList.add("hide")}
// ===== Phòng: kiểm tra mã phòng trong địa chỉ (?r=MÃ) =====
const RC=ROOM?fetch("/api/rooms/info?r="+ROOM).then(r=>r.json()).catch(()=>({ok:true})):Promise.resolve(null);
function noRoomUI(msg){$("#nm").style.display="none";$("#rc").style.display="";$("#go").textContent="VÀO PHÒNG";
 try{$("#rc").value=ROOM||localStorage.lastroom||""}catch(e){}
 if(msg){const j=$("#jmsg");j.textContent=msg;j.style.display="block"}}
if(!ROOM)noRoomUI("");
else RC.then(i=>{if(i&&i.ok===false)noRoomUI("Phòng "+ROOM+" không tồn tại. Kiểm tra lại mã phòng nhé.");else if(i&&i.name)$("#rname").textContent="🏠 "+i.name});
$("#go").onclick=async()=>{
 if($("#rc").style.display!="none"){const c=$("#rc").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!c)return alert("Vui lòng nhập mã phòng");
  const i=await fetch("/api/rooms/info?r="+c).then(r=>r.json()).catch(()=>({ok:false}));
  if(!i.ok)return alert("Không tìm thấy phòng "+c);
  try{localStorage.lastroom=c}catch(e){}return location.href="/?r="+c}
 const name=$("#nm").value.trim();if(!name)return alert("Vui lòng nhập tên");
 const r=await api("join",{name});if(r.err)return alert(r.err);
 me=r.me;try{localStorage["pid_"+ROOM]=me;localStorage.pname=name}catch(e){}
 if(r.rejoin)alert("👋 Chào mừng bạn quay lại! Đã khôi phục trạng thái của bạn.");enter()};
try{if(!me)$("#nm").value=localStorage.pname||""}catch(e){}
// ===== Mở lại trang: kiểm tra trạng thái trên server trước, tránh báo "bị xoá" nhầm =====
if(ROOM&&me)RC.then(i=>{if(i&&i.ok===false)return;api("state",{}).then(r=>{
  if(r&&r.kicked&&r.kicked.indexOf(me)>=0){alert("⚠️ Bạn đã bị quản trò xoá khỏi phòng chơi.");showJoin("",false)}
  else if(r&&Array.isArray(r.players)&&r.now&&!r.players.some(p=>p.id==me))showJoin("Phòng đã được làm mới. Nhập tên để vào lại.",true);
  else enter()}).catch(()=>enter())})
$("#spin").onclick=async()=>{
 if($("#spin").disabled)return;$("#spin").disabled=true;
 const cd=$("#countdown");for(const n of [3,2,1]){cd.textContent=n;cd.className="show";await new Promise(r=>setTimeout(r,620));cd.className="";await new Promise(r=>setTimeout(r,90));}
 cd.textContent="GO!";cd.className="show";await new Promise(r=>setTimeout(r,320));cd.className="";
 try{S=await api(S.mode=="all"?"spinme":"spin",{pid:me});onS()}catch(e){$("#spin").disabled=false;alert("Chưa kết nối được. Vui lòng thử quay lại.")}
};
function onS(){
 // ===== Chỉ xử lý khi đã có dữ liệu THẬT từ server (S.now), không dựa vào S khởi tạo rỗng =====
 if(!S||!S.now||!Array.isArray(S.players))return;
 if(S.kicked&&S.kicked.indexOf(me)>=0){try{localStorage.removeItem("pid_"+ROOM);localStorage.removeItem("pname")}catch(e){}alert("⚠️ Bạn đã bị quản trò xoá khỏi phòng chơi.");return location.reload()}
 if(!S.players.some(p=>p.id==me)){try{localStorage.removeItem("pid_"+ROOM)}catch(e){}return location.reload()}
 renderScore();const t=S.turn,m=S.players.find(p=>p.id==me);
 const all=S.mode=="all",o=all&&S.pl&&S.pl[me];
 if(all){$("#spin").disabled=!(S.status=="playing"&&!o);
  $("#msg").textContent=S.status=="ended"?"🏆 Kết thúc! Điểm của bạn: "+m.score:!o?(S.status=="playing"?"🎯 Bấm vào vòng tròn giữa để QUAY":"Chờ ban tổ chức bắt đầu…"):
   !spinDone(S,o)?"🚗 Xe đang chạy…":o.n<S.per?"📝 Đang trả lời câu hỏi…":`Bạn đúng ${o.ok}/${S.per} câu. Chờ mọi người…`;
  if(o&&held(S,o)&&o.n<S.per&&!quizOn&&doneId!=1)quiz({id:1,region:o.region,n:o.n,banner:1});return}
 const mine=t&&t.pid==me;$("#spin").disabled=!(mine&&t.phase=="ready"&&S.status=="playing");
 $("#msg").textContent=S.status=="ended"?"🏆 Kết thúc! Điểm của bạn: "+m.score:!t?(S.status=="playing"?"✅ Đã bắt đầu! Chờ ban tổ chức tạo lượt…":"Chờ ban tổ chức bắt đầu…"):
  mine&&t.phase=="ready"?"🎯 Đến lượt bạn! Bấm vào vòng tròn giữa để QUAY":
  mine&&t.phase=="done"?`Bạn đúng ${t.ok}/${S.per} câu. Chờ lượt kế…`:mine?"Xe đang chạy…":"Đang chơi: "+t.name;
 if(mine&&(t.phase=="spin"||t.phase=="quiz")&&held(S)&&!quizOn&&doneId!=t.id)quiz(t)}
function quiz(t){quizOn=true;let n=t.n;const r=t.region,per=S.per;
 function ask(){
  if(n>=per){doneId=t.id;quizOn=false;chain=chain.then(()=>new Promise(r=>setTimeout(r,5000))).then(()=>api("next",{tid:t.id})).then(s=>{S=s;onS()}).catch(()=>{});return $("#ov").classList.add("hide")}
  if(!(decks[r]&&decks[r].length))decks[r]=shuf([...Q[r],...Q.chung]);
  const q=decks[r].pop(),o=shuf(q.a.map((x,i)=>({x,i})));
  $("#ov").classList.remove("ban");$("#card").classList.remove("ban");$("#card").style.backgroundImage="";$("#card").innerHTML=`<div class="hd" style="background:${COL[r]}">${NM[r]} · Câu ${n+1}/${per}</div><h2>${esc(q.q)}</h2><div id="opts">`+
   o.map((y,k)=>`<button class="opt" data-i="${y.i}">${"ABCD"[k]}. ${esc(y.x)}</button>`).join("")+"</div>";
  $("#ov").classList.remove("hide");
  {const qa=o.map(y=>y.x);api("q",{pid:me,n:n,q:q.q,a0:qa[0]||"",a1:qa[1]||"",a2:qa[2]||"",a3:qa[3]||"",c:o.findIndex(y=>y.i==q.c)}).catch(()=>{})}
  const bs=[...document.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{const good=+b.dataset.i==q.c;
   
   bs.forEach(x=>{x.onclick=null;if(+x.dataset.i==q.c)x.classList.add("ok")});if(!good)b.classList.add("bad");
   chain=chain.then(()=>api("ans",{pid:me,ok:good?1:0,pick:bs.indexOf(b)})).then(s=>{S=s;onS()}).catch(()=>{});
   n++;setTimeout(ask,1300)})}
 if(t.banner){$("#ov").classList.add("ban");$("#card").classList.add("ban");$("#card").style.backgroundImage=`url(${r}.webp)`;$("#card").style.setProperty("--c",COL[r]);$("#card").innerHTML=`<div class="cap"><small>Bạn đã đến</small><b>${NM[r]} 🎉</b></div>`;$("#ov").classList.remove("hide");setTimeout(ask,3500)}else ask()}
</script></body></html>
