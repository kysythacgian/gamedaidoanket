<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết - Admin</title><link rel="stylesheet" href="style.css">
<style>
#start{width:100%;font-size:clamp(24px,5vw,40px);padding:26px 20px;border-radius:22px;box-shadow:0 8px 0 #b8901e;transition:.2s}
#start:active{transform:translateY(6px);box-shadow:0 2px 0 #b8901e}
#start.busy{opacity:.7}
#start.done{background:#2eb872;color:#fff;box-shadow:0 8px 0 #1b7a4b;animation:pop .6s}
#start.end{background:#8a96a8;color:#fff;box-shadow:0 8px 0 #5d6776}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);background:#2eb872;color:#fff;font-weight:800;font-size:20px;padding:14px 24px;border-radius:14px;z-index:20;transition:.35s;box-shadow:0 6px 20px #0008;max-width:92vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:#e0453a}
#flash{position:fixed;inset:0;background:#2eb872;opacity:0;pointer-events:none;z-index:15}
#flash.go{animation:fl .8s}@keyframes fl{0%{opacity:.55}100%{opacity:0}}
select:disabled{opacity:.6}
#pw{width:min(340px,70vw);font-size:26px;text-align:center;letter-spacing:3px;border:3px solid #f5c542;background:#fff;color:#12345a}
#eye{background:#ffffff26;color:#fff;font-size:26px;padding:8px 14px}
#lerr{min-height:30px;font-weight:800;font-size:20px;color:#ff8a80}
#plist{width:100%}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff1a;border-radius:12px;padding:6px 10px;margin:6px 0}
.pl .nm{font-size:20px;text-align:left}
.pl .meta{opacity:.85;font-size:14px}
.pl button{font-size:18px;padding:8px 14px;border-radius:12px}
.pl .empty{opacity:.7;font-size:18px;padding:8px}
#rlist,#rbox{width:min(620px,100%)}
.grp{display:grid;gap:10px;width:100%;margin-top:10px}
.grp.two{grid-template-columns:1fr 1fr}.grp.two-l{grid-template-columns:3fr 2fr}
.cbtn{font:inherit;font-weight:800;font-size:16px;line-height:1.2;color:#fff;background:#ffffff26;border:0;border-radius:14px;
 min-height:52px;padding:10px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;box-shadow:none}
.cbtn:active{transform:translateY(2px)}
.cbtn.main{font-size:24px;min-height:70px;background:#f5c542;color:#12345a;box-shadow:0 5px 0 #b8901e}
.cbtn.main:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901e}
.cbtn.red{background:#e0453a}
.rm{background:#ffffff1a;border-radius:16px;padding:14px;margin:12px 0;text-align:center}
.rm .t{font-size:24px;font-weight:800}.rm .c{color:#f5c542;letter-spacing:3px;font-weight:800}
#rinfo{font-size:18px;background:#ffffff1a;border-radius:12px;padding:8px 12px;text-align:center}
#rnew{width:100%;box-sizing:border-box;font-size:20px;text-align:center}

/* ===== Bố cục trang Điều khiển: canh giữa, đều chiều rộng ===== */
#panel .wrap{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;gap:12px}
#panel .wrap>*{width:100%;box-sizing:border-box}
#panel h1,#panel h2{margin:0;text-align:center}
#panel .row{justify-content:center;flex-wrap:wrap}
#panel #info{text-align:center;line-height:1.5;font-size:20px}
#links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
#score{width:100%}
</style></head><body style="overflow:auto">
<div id="toast"></div><div id="flash"></div>
<div id="login" class="screen"><h1>🔒 ĐĂNG NHẬP ADMIN</h1>
<div style="font-size:20px">Nhập mã admin để điều khiển trò chơi</div>
<div class="row"><input id="pw" type="password" placeholder="Mã admin" autocomplete="off"><button id="eye" title="Hiện/ẩn mã">👁</button></div>
<div id="lerr"></div><button class="big" id="lgo">🔓 VÀO</button></div>

<div id="rooms" class="screen hide"><h1>🏠 QUẢN LÝ PHÒNG</h1>
<div id="rbox"><input id="rnew" maxlength="40" placeholder="Tên đơn vị, Khu dân cư">
<div class="grp"><button class="cbtn main" id="radd">➕ TẠO PHÒNG</button></div></div>
<div id="rcount" style="font-size:18px;margin-top:8px"></div><div id="rlist"></div>
<div id="rbox2" style="width:min(620px,100%);margin-bottom:24px"><div class="grp"><button class="cbtn" id="out2">🚪 Đăng xuất</button></div></div></div>

<div id="panel" class="screen hide">
  <div class="wrap">
    <h1>⚙️ ĐIỀU KHIỂN</h1>
    <div id="rinfo"></div>
    <div id="links">
      <button class="cbtn" id="cpl" title="Sao chép link người chơi">📋 Link người chơi</button>
      <button class="cbtn" id="cptv" title="Sao chép link tivi">📺 Link tivi</button>
    </div>
    <div class="grp two" style="margin-top:0">
      <button id="back" class="cbtn">← Danh sách phòng</button>
      <button id="out" class="cbtn red">🚪 Đăng xuất</button>
    </div>
    <div class="row">Chế độ: <select id="mode"><option value="all">Tất cả cùng chơi 1 lần</option><option value="seq">Lần lượt từng người</option></select></div>
    <label class="row"><input type="checkbox" id="auto" checked style="width:28px;height:28px"> Tự động chuyển lượt</label>
    <button class="big" id="start">▶ BẮT ĐẦU TRÒ CHƠI</button>
    <div id="actions">
      <button class="big" id="turn">🎲 TẠO LƯỢT</button>
      <button class="big" id="skip">⏭ BỎ LƯỢT</button>
      <button class="big red" id="reset">🗑 XOÁ TẤT CẢ</button>
    </div>
    <div id="info"></div>
    <h2>👥 Danh sách người chơi</h2>
    <div id="plist"></div>
    <div id="score"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
let K="";
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="show"+(bad?" err":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",2800)}
async function act(a,x={}){try{const r=await api(a,{k:K,...x});S=r;if(r.err)toast(r.err,1);show();return r}catch(e){toast("Lỗi kết nối, thử lại",1)}}

$("#start").onclick=async()=>{const b=$("#start");
 if(S&&S.status=="playing")return toast("Trò chơi đã bắt đầu rồi");
 if(S&&S.status=="ended")return toast("Đã kết thúc — bấm Xoá tất cả để chơi lại",1);
 b.className="big busy";b.textContent="⏳ Đang gửi…";
 const r=await act("start",{auto:$("#auto").checked?1:0,mode:$("#mode").value});
 if(r&&!r.err&&r.status=="playing"){$("#flash").className="";void $("#flash").offsetWidth;$("#flash").className="go";toast("🎉 Đã bắt đầu! "+(S.mode=="all"?"Mọi người bấm QUAY trên điện thoại":S.auto?"Lượt đầu tiên đã được tạo":"Bấm TẠO LƯỢT để chọn người chơi"))}else show()};
$("#turn").onclick=async()=>{const r=await act("turn");if(r&&!r.err&&r.turn&&r.turn.phase=="ready")toast("🎲 Đã tạo lượt cho "+r.turn.name);else if(r&&!r.err&&r.status=="ended")toast("🏁 Đã hết các vòng — trò chơi kết thúc")};
$("#mode").onchange=()=>show();
$("#skip").onclick=async()=>{const r=await act("skip");if(r&&!r.err)toast("⏭ Đã bỏ lượt")};
$("#reset").onclick=async()=>{if(confirm("Xoá toàn bộ người chơi và điểm?")){const r=await act("reset");if(r&&!r.err)toast("🗑 Đã xoá tất cả")}};

// ===== Nút chép link trong mục Điều khiển =====
async function copyText(u){try{await navigator.clipboard.writeText(u);toast("📋 Đã chép: "+u)}catch(x){prompt("Chép link này:",u)}}
$("#cpl").onclick=()=>{if(!S||!S.room)return toast("Chưa có phòng",1);copyText(location.origin+"/?r="+S.room)};
$("#cptv").onclick=()=>{if(!S||!S.room)return toast("Chưa có phòng",1);copyText(location.origin+"/tv.html?r="+S.room+"#"+S.room)};

// ===== Danh sách người chơi (hiện cả khi chưa bắt đầu) =====
function renderPlayers(){
  const box=$("#plist");if(!box)return;
  const L=(S&&S.players)||[];
  if(!L.length){box.innerHTML=`<div class="pl empty">Chưa có người chơi nào tham gia</div>`;return}
  const turnPid=(S&&S.turn)?String(S.turn.pid):"";
  box.innerHTML=L.map(p=>{
    const me=(S&&S.pl&&S.pl[p.id])?S.pl[p.id]:null;
    const isTurn=String(p.id)===turnPid;
    const prog=me?` · câu ${me.n}/${S.per}`:"";
    return `<div class="pl">
      <span class="nm">${esc(p.name)}${isTurn?' <span style="color:#f5c542">← đang chơi</span>':''}<br>
        <span class="meta">${p.score} điểm · ${p.turns} lượt${prog}</span>
      </span>
      <button class="big red" data-kick="${esc(p.id)}" title="Xoá người chơi này">❌ Xoá</button>
    </div>`;
  }).join("");
}
$("#plist").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-kick]");if(!btn)return;
  const id=btn.getAttribute("data-kick");
  const p=(S&&S.players)?S.players.find(x=>String(x.id)===String(id)):null;
  const name=p?p.name:id;
  if(!confirm(`Xoá người chơi "${name}" khỏi danh sách?\nThiết bị của người này sẽ tự thoát ngay.`))return;
  btn.disabled=true;
  const r=await act("kick",{pid:id});
  if(r&&!r.err)toast(`🗑 Đã xoá "${name}"`);else btn.disabled=false;
});

function show(){
  if(S&&S.room)$("#rinfo").innerHTML=`📍 <b>${esc(S.roomName||"")}</b> · Mã phòng: <b>${esc(S.room)}</b>`;
  renderPlayers();
  if(!S||!S.players)return;
  renderScore();
  const t=S.turn,b=$("#start");
  if(S.status=="playing"){b.className="big done";b.textContent="✅ ĐÃ BẮT ĐẦU";$("#auto").checked=!!S.auto;$("#auto").disabled=true}
  else if(S.status=="ended"){b.className="big end";b.textContent="🏁 ĐÃ KẾT THÚC";$("#auto").disabled=true}
  else{b.className="big";b.textContent="▶ BẮT ĐẦU TRÒ CHƠI";$("#auto").disabled=false}
  const all=S.status=="lobby"?$("#mode").value=="all":S.mode=="all";
  if(S.status!="lobby")$("#mode").value=S.mode||"seq";$("#mode").disabled=S.status!="lobby";
  $("#turn").style.display=all?"none":"";$("#auto").parentNode.style.display=all?"none":"";
  $("#skip").textContent=all?"🏁 KẾT THÚC NGAY":"⏭ BỎ LƯỢT";
  const sp=S.players.filter(p=>S.pl&&S.pl[p.id]).length,dn=S.players.filter(p=>S.pl&&S.pl[p.id]&&S.pl[p.id].n>=S.per).length;
  $("#info").innerHTML=`Trạng thái: <b>${S.status=="playing"?"đang chơi":S.status=="ended"?"đã kết thúc":"chờ bắt đầu"}</b> · Người chơi: ${S.players.length}<br>`+(all?(S.status=="lobby"?"Tất cả cùng chơi":`Tất cả cùng chơi · đã quay ${sp}/${S.players.length} · đã xong ${dn}/${S.players.length}`):t?`Lượt #${t.id}: <b>${esc(t.name)}</b> (${t.phase}) · câu ${t.n}/${S.per} · đúng ${t.ok}`:"Chưa có lượt — bấm TẠO LƯỢT")}

async function login(key){const b=$("#lgo"),e=$("#lerr");e.textContent="";b.disabled=true;b.textContent="⏳ Đang kiểm tra…";
 try{
  if(!ROOM){K=key;const r=await rooms("list");if(r.err){K="";e.textContent="❌ "+r.err+" — nhập lại nhé";$("#pw").select();return}
   sessionStorage.k=key;$("#login").classList.add("hide");$("#rooms").classList.remove("hide");showRooms(r);return}
  const r=await api("auth",{k:key});
  if(r.err){e.textContent="❌ "+r.err+" — nhập lại nhé";$("#pw").select();return}
  K=key;sessionStorage.k=key;$("#login").classList.add("hide");$("#panel").classList.remove("hide");
  S=r;show();poll(show,2000)}
 catch(x){e.textContent="⚠️ Không kết nối được máy chủ (kiểm tra mạng)"}
 finally{b.disabled=false;b.textContent="🔓 VÀO"}}
$("#lgo").onclick=()=>login($("#pw").value);
$("#pw").onkeydown=e=>{if(e.key=="Enter")login($("#pw").value)};
$("#eye").onclick=()=>{const p=$("#pw");p.type=p.type=="password"?"text":"password"};
$("#out").onclick=$("#out2").onclick=()=>{sessionStorage.removeItem("k");location.reload()};
$("#back").onclick=()=>location.href="admin.html";

// ===== Quản lý phòng (khi mở admin.html không có ?r=) =====
async function rooms(op,x={}){const r=await fetch("/api/rooms",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:K,op,...x})});return r.json()}
function showRooms(r){const L=r.rooms||[];$("#rcount").textContent=`Đang có ${L.length}/${r.max} phòng`;
 $("#rlist").innerHTML=L.length?L.map(m=>`<div class="rm"><div class="t">${esc(m.name)}</div><div>Mã phòng: <span class="c">${esc(m.code)}</span></div>
  <div class="grp two"><button class="cbtn" data-cp="${esc(m.code)}">📋 Link người chơi</button><button class="cbtn" data-cptv="${esc(m.code)}">📺 Link tivi</button></div>
  <div class="grp two-l"><button class="cbtn main" data-go="${esc(m.code)}">⚙️ Điều khiển</button><button class="cbtn red" data-del="${esc(m.code)}" data-nm="${esc(m.name)}">🗑 Xoá phòng</button></div></div>`).join(""):`<div class="pl empty">Chưa có phòng nào — hãy tạo phòng đầu tiên</div>`}
$("#radd").onclick=async()=>{const b=$("#radd");b.disabled=true;try{const r=await rooms("create",{name:$("#rnew").value});if(r.err)toast(r.err,1);else{$("#rnew").value="";showRooms(r);toast("✅ Đã tạo phòng "+r.room.code)}}catch(e){toast("Lỗi kết nối, thử lại",1)}b.disabled=false};
$("#rlist").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go)return location.href="admin.html?r="+d.go+"#"+d.go;
 if(d.cp){const u=location.origin+"/?r="+d.cp;try{await navigator.clipboard.writeText(u);toast("📋 Đã chép: "+u)}catch(x){prompt("Chép link này:",u)}return}
 if(d.cptv){const u=location.origin+"/tv.html?r="+d.cptv+"#"+d.cptv;try{await navigator.clipboard.writeText(u);toast("📋 Đã chép: "+u)}catch(x){prompt("Chép link này:",u)}return}
 if(d.del&&confirm(`Xoá phòng "${d.nm}" (${d.del})?\nToàn bộ người chơi và điểm của phòng sẽ mất.`)){const r=await rooms("delete",{code:d.del});if(r.err)toast(r.err,1);else{showRooms(r);toast("🗑 Đã xoá phòng")}}});
if(sessionStorage.k)login(sessionStorage.k);else $("#pw").focus();
</script></body></html>
