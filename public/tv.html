<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại đoàn kết - TV</title><link rel="stylesheet" href="style.css">
<style>
  #welcome{
    position:fixed;inset:0;z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;gap:10px;
    background:radial-gradient(circle at 50% 30%, #8a1111 0%, #4a0808 55%, #1a0303 100%);
  }
  #welcome img{width:clamp(120px,18vh,220px);height:clamp(120px,18vh,220px);
               object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
  #welcome h1{margin:6px 0 0;color:#fff;
              font-size:clamp(22px,3.8vw,44px);
              text-shadow:0 2px 10px rgba(0,0,0,.65);letter-spacing:1px}
  #welcome .slogan{margin:6px 0 4px;color:#FFFF00;font-weight:700;
                   font-size:clamp(17px,3vw,36px);line-height:1.4}
  #welcome .slogan b{display:block;color:#FFFF00;font-size:inherit;margin-top:4px;
                     text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #welcome #wj{margin-top:14px;color:#fff;
               font-size:clamp(14px,1.5vw,22px);line-height:1.6}
  #welcome #wj .url{color:#f5c542;word-break:break-all;font-weight:700}
  #welcome #wj .cnt{display:inline-block;min-width:2ch;color:#7CFC9B;font-weight:800}
  #qbox{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;justify-content:center;
        gap:3vh;padding:4vh 5vw;background:radial-gradient(circle at 50% 20%,#8a1111 0%,#4a0808 60%,#1a0303 100%);color:#fff}
  #qbox .qh{color:#f5c542;font-weight:800;font-size:clamp(16px,2.4vw,32px)}
  #qbox .qt{font-weight:800;line-height:1.35;font-size:clamp(22px,4vw,54px);text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #qbox .qa{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw}
  #qbox .a{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);
           border-radius:18px;padding:2vh 1.6vw;font-weight:700;font-size:clamp(18px,3vw,40px);line-height:1.3}
  #qbox .a b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;
             border-radius:50%;background:#f5c542;color:#4a0808}
  #qbox .a.bad{background:#c0392b;border-color:#ff9c92}
  #qbox .a.ok{background:#1f9d55;border-color:#7CFC9B}
  @media(max-width:700px){#qbox .qa{grid-template-columns:1fr}}
</style>
</head><body>
<div id="welcome">
  <img src="icon.png" alt="Logo" onerror="this.style.display='none'">
  <h1>Game "Đại Đoàn Kết"</h1>
  <p class="slogan">NHIỆT LIỆT CHÀO MỪNG<b>NGÀY HỘI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC!</b></p>
  <div id="wj"></div>
</div>

<div id="qbox"></div>

<div id="app"><div id="wrap"><div id="board"><img id="car" src="car.svg" alt=""></div></div>
<div id="side"><h2 id="head"></h2><div id="info"></div><div id="score"></div></div></div>
<script src="board.js"></script><script src="common.js"></script>
<script>
S={players:[],turn:null,dur:6000};fit();
/* Xe chạy liên tục ngay khi có người chơi vào (chỉ dừng khi chưa có ai), không phụ thuộc dữ liệu quay từ server */
let ang=0,last=performance.now();const SPEED=90;/* độ/giây: 1 vòng ~4 giây */
(function f(now){const dt=(now-last)/1000;last=now;
 const tt=S&&S.turn,follow=!!(S&&S.mode!="all"&&tt&&tt.t0>0),run=!!(S&&S.players&&S.players.length>0);
 /* Lượt lần lượt: xe trên TV chạy đúng như xe trên điện thoại; còn lại xe chạy vòng liên tục */
 if(follow)ang=((angleOf(S,tt)%360)+360)%360;else if(run)ang=(ang+SPEED*dt)%360;
 window.Board&&Board.update(ang,follow?(spinDone(S,tt)?"stop":"run"):run?"run":"idle");
 const t=ang*Math.PI/180,c=$("#car");
 c.style.left=50+46.5*Math.sin(t)+"%";c.style.top=50-46.5*Math.cos(t)+"%";
 c.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;requestAnimationFrame(f)})(last);

/* Danh sách chung: người chơi nhóm theo vùng đã quay được (dùng cho cả 2 chế độ) */
function listHTML(){
  const g={bac:[],trung:[],nam:[]},N=S.players.length;let sp=0,dn=0;
  S.players.forEach(p=>{const o=S.pl&&S.pl[p.id];if(!o||!g[o.region])return;sp++;if(o.n>=S.per)dn++;if(spinDone(S,o))g[o.region].push(p.name)});
  return Object.keys(g).map(r=>g[r].length?`<div style="color:${COL[r]}"><b>${NM[r]}</b>: <span style="color:#fff">${g[r].map(esc).join(", ")}</span></div>`:"").join("")+
    `<div style="margin-top:6px">Đã chơi: ${dn}/${N}</div>`;
}
const joinURL=location.origin+"/?r="+ROOM;
if(ROOM){try{localStorage.tvroom=ROOM}catch(e){}}
else{let last="";try{last=localStorage.tvroom||""}catch(e){}
 tvMsg(`Chưa chọn phòng.<br>Nhập mã phòng:<br><input id="trc" maxlength="8" value="${esc(last)}" style="font-size:1.4em;text-transform:uppercase;text-align:center;width:9em;margin:8px;border-radius:10px;border:0;padding:6px"> <button id="trg" style="font-size:1.2em;padding:8px 16px;border-radius:10px;border:0;background:#f5c542;font-weight:800">VÀO</button><br><small>Hoặc vào admin</span> bấm 📺 Mở TV.</small>`);
 const go=()=>{const c=$("#trc").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(c)location.href="tv.html?r="+c+"#"+c};
 $("#trg").onclick=go;$("#trc").onkeydown=e=>{if(e.key=="Enter")go()}}
function tvMsg(t){$("#welcome").style.display="flex";$("#wj").innerHTML=t}
if(ROOM)fetch("/api/rooms/info?r="+ROOM).then(r=>r.json()).then(j=>{if(!j.ok)tvMsg(`Phòng <b>${esc(ROOM)}</b> không tồn tại hoặc đã bị xóa.<br>Liên hệ "admin" nhận mã phòng!`)}).catch(()=>tvMsg("Không kết nối được máy chủ.<br>Hãy tải lại trang (F5)."));
let live=null;
poll(()=>{},700);
setInterval(()=>{
  if(!S.status)return;renderScore();
  const t=S.turn,h=$("#head"),i=$("#info"),w=$("#welcome");

  /* ===== LOBBY: hiện màn hình chào mừng với logo + khẩu hiệu ===== */
  if(S.status=="lobby"){
    w.style.display="flex";
    $("#wj").innerHTML=`${S.roomName?`<b style="font-size:1.3em">${esc(S.roomName)}</b><br>`:""}Mã phòng: <b class="cnt" style="font-size:1.6em;letter-spacing:4px">${esc(S.room||ROOM)}</b><br>Mở trên điện thoại:<br><span class="url">${esc(joinURL)}</span>`+
                       `<br>Đã vào: <span class="cnt">${S.players.length}</span>`;
    return;
  }
  /* Đã bắt đầu → ẩn màn hình chào mừng */
  if(w.style.display!="none")w.style.display="none";

  if(S.status=="ended"){h.textContent="🏆 KẾT QUẢ";i.textContent="Chào mừng tham gia trò chơi Đại Đoàn Kết!!";return}
  if(S.mode=="all"){
    const g={bac:[],trung:[],nam:[]},N=S.players.length;let sp=0,dn=0;
    S.players.forEach(p=>{const o=S.pl&&S.pl[p.id];if(!o)return;sp++;if(o.n>=S.per)dn++;if(spinDone(S,o))g[o.region].push(p.name)});
    h.textContent=!t?"🎉 Đã bắt đầu!":!spinDone(S)?"🚗 "+t.name+" đang quay…":"🎯 "+t.name+" đến "+NM[t.region];
    i.innerHTML=(!sp?"Mọi người bấm QUAY trên điện thoại":"")+Object.keys(g).map(r=>g[r].length?`<div style="color:${COL[r]}"><b>${NM[r]}</b>: <span style="color:#fff">${g[r].map(esc).join(", ")}</span></div>`:"").join("")+`<div style="margin-top:6px">Đã quay: ${sp}/${N} · Đã xong: ${dn}/${N}</div>`;return}
  const qb=$("#qbox");qb.style.display="none";
  if(S.status=="playing"&&!t){h.textContent="🎉 Đã bắt đầu!";i.innerHTML="Chuẩn bị lượt kế tiếp…"+listHTML();return}
  h.textContent=t.phase=="done"?"🏁 Kết thúc lượt: "+t.name:"Lượt: "+t.name;
  if(t.phase=="ready")i.innerHTML="Chuẩn bị quay…"+listHTML();
  else if(!spinDone(S))i.textContent="🚗 Xe đang chạy…";
  else if(t.phase=="done")i.innerHTML=`${esc(t.name)} đúng <b>${t.ok}/${S.per}</b> câu`+listHTML();
  else i.innerHTML=`<span style="color:${COL[t.region]};font-size:1.5em">${NM[t.region]}</span><br>Câu ${Math.min(t.n+1,S.per)}/${S.per} · đúng ${t.ok}`;
  /* Lần lượt từng người: hiện câu hỏi + đáp án của người đang chơi (điện thoại gửi lên qua action "q") */
  let q=t.q;
  if(live&&live.tid===t.id&&(!q||live.n>=q.n)){q=Object.assign({},live);if(t.q&&t.q.n===q.n&&t.q.done){q.done=1;q.pick=t.q.pick}}
  if(held(S)&&t.phase!="ready"&&t.phase!="done"&&q&&q.q){
    const done=!!q.done,L="ABCD";
    qb.innerHTML=`<div class="qh">${esc(t.name)} · ${NM[t.region]||""} · Câu ${Math.min(q.n+1,S.per)}/${S.per} · đúng ${t.ok}</div>`+
      `<div class="qt">${esc(q.q)}</div><div class="qa">`+
      (q.a||[]).map((o,k)=>`<div class="a${done&&k==q.c?" ok":""}${done&&k==q.pick&&k!=q.c?" bad":""}"><b>${L[k]}</b><span>${esc(o)}</span></div>`).join("")+`</div>`;
    qb.style.display="flex";
  }
},250);
</script></body></html>
